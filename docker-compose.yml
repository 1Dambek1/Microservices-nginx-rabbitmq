services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: project2_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  users_service:
    image: project2_users_service:latest
    build:
      context: ./users_service
    container_name: project2_users_service
    environment:
      USERS_DB_PATH: /data/users.db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      USERS_RPC_QUEUE: users.rpc
    volumes:
      - users_data:/data
    ports:
      - "8001:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
  start_service:
    image: project2_start_service:latest
    build:
      context: ./start_service
    container_name: project2_start_service
    ports:
      - "8000:8000"
  products_service_1:
    image: project2_products_service:latest
    build:
      context: ./products_service
    container_name: project2_products_service_1
    environment:
      APP_INSTANCE: products-service-1
      PRODUCTS_DATABASE_URL: postgresql://neondb_owner:npg_BQ1YKd6tLCNo@ep-raspy-silence-ap9menkm.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      USERS_RPC_QUEUE: users.rpc
    depends_on:
      rabbitmq:
        condition: service_healthy
      users_service:
        condition: service_started

  products_service_2:
    image: project2_products_service:latest
    container_name: project2_products_service_2
    environment:
      APP_INSTANCE: products-service-2
      PRODUCTS_DATABASE_URL: postgresql://neondb_owner:npg_BQ1YKd6tLCNo@ep-raspy-silence-ap9menkm.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      USERS_RPC_QUEUE: users.rpc
    depends_on:
      rabbitmq:
        condition: service_healthy
      users_service:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: project2_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - products_service_1
      - products_service_2
      - users_service
      - start_service

volumes:
  users_data:
