services:
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  users_service:
    image: project2_users_service:latest
    build:
      context: ./users_service
    restart: unless-stopped
    environment:
      USERS_DB_PATH: ${USERS_DB_PATH:-/data/users.db}
      RABBITMQ_URL: ${RABBITMQ_URL}
      USERS_RPC_QUEUE: ${USERS_RPC_QUEUE:-users.rpc}
      ROOT_PATH: /users
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      - users_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy


  products_service_1:
    image: project2_products_service:latest
    build:
      context: ./products_service
    restart: unless-stopped
    environment:
      APP_INSTANCE: products-service-1
      PRODUCTS_DATABASE_URL: ${PRODUCTS_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      USERS_RPC_QUEUE: ${USERS_RPC_QUEUE:-users.rpc}
      ROOT_PATH: /products
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      rabbitmq:
        condition: service_healthy
      users_service:
        condition: service_healthy

  products_service_2:
    image: project2_products_service:latest
    restart: unless-stopped
    environment:
      APP_INSTANCE: products-service-2
      PRODUCTS_DATABASE_URL: ${PRODUCTS_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      USERS_RPC_QUEUE: ${USERS_RPC_QUEUE:-users.rpc}
      ROOT_PATH: /products
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      rabbitmq:
        condition: service_healthy
      users_service:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  users_data:
